name: "lallamaollama"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-motor
    mem_limit: ${OLLAMA_MEM_LIMIT:-6g}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        echo "=== Ollama ready ==="
        wait
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_CONTEXT_LENGTH=16384
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_LLM_LIBRARY=cuda_v12
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_LOAD_TIMEOUT=15m
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_VULKAN=false
      - OLLAMA_DEBUG=1
    runtime: nvidia
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mcp-network
    restart: unless-stopped
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    mem_limit: ${BACKEND_MEM_LIMIT:-256m}
    volumes:
      - ollama_data:/root/.ollama
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434
      - APP_PORT=${APP_PORT:-3016}
      - API_KEY=${API_KEY:-McPOllama2026-V1-Home}
      - NGROK_CONTAINER_NAME=mcp-ngrok-tunnel
    ports:
      - "${APP_PORT:-3016}:${APP_PORT:-3016}"
    networks:
      - mcp-network
    restart: unless-stopped
  ngrok:
    image: ngrok/ngrok:latest
    container_name: mcp-ngrok-tunnel
    mem_limit: ${NGROK_MEM_LIMIT:-128m}
    profiles:
      - tunnel
    depends_on:
      - backend
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - http
      - backend:${APP_PORT:-3016}
    networks:
      - mcp-network
    restart: "no"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:${APP_PORT:-3016}
        - VITE_SOCKET_URL=http://localhost:${APP_PORT:-3016}
        - VITE_BRAIN_API_URL=http://localhost:${BRAIN_PORT:-3015}
        - VITE_ENGINE_URL=http://localhost:${ENGINE_PORT:-3020}
    container_name: frontend
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    ports:
      - "8080:80"
    environment:
      # inside docker the backend is reachable by service name
      - VITE_API_URL=http://localhost:${APP_PORT:-3016}
      - VITE_SOCKET_URL=http://localhost:${APP_PORT:-3016}
      - VITE_ENGINE_URL=http://localhost:${ENGINE_PORT:-3020}
    networks:
      - mcp-network
    depends_on:
      - backend
    restart: unless-stopped
  agent-frontend:
    build:
      context: ./agent-frontend
      dockerfile: Dockerfile
      args:
        - VITE_ENGINE_URL=http://localhost:${ENGINE_PORT:-3020}
        - VITE_API_KEY=${API_KEY:-McPOllama2026-V1-Home}
    container_name: agent-frontend
    mem_limit: ${AGENT_FRONTEND_MEM_LIMIT:-256m}
    ports:
      - "8081:80"
    environment:
      - VITE_ENGINE_URL=http://agent-engine:${ENGINE_PORT:-3020}
      - VITE_API_KEY=${API_KEY:-McPOllama2026-V1-Home}
    networks:
      - mcp-network
    depends_on:
      - agent-engine
    restart: unless-stopped
  mcp-brain:
    build:
      context: ./mcp-brain
      dockerfile: Dockerfile
    container_name: brain
    mem_limit: ${BRAIN_MEM_LIMIT:-256m}
    ports:
      - "${BRAIN_PORT:-3015}:${BRAIN_PORT:-3015}"
    environment:
      - BRAIN_PORT=${BRAIN_PORT:-3015}
      - OLLAMA_API_URL=http://ollama:11434
      - BACKEND_URL=http://backend:${APP_PORT:-3016}
      - API_KEY=${API_KEY:-McPOllama2026-V1-Home}
    volumes:
      # OPCIÓN A (Recomendada - Bind Mount al Host):
      # Conecta la carpeta local de Windows './data' con '/app/data' dentro de Docker.
      # Permite que el Dashboard y los agentes del IDE compartan exactamente el mismo archivo SQLite (lallama-memory.db).
      - ./data:/app/data

      # OPCIÓN B (Aislada - Volumen Virtual de Docker):
      # Si prefieres que la base de datos viva de forma completamente aislada dentro del motor de Docker
      # (sin tocar tu disco en Windows), comenta la línea de arriba y descomenta la siguiente:
      # - brain_data:/app/data
    depends_on:
      - ollama
    networks:
      - mcp-network
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: agent-engine-redis
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    command: redis-server --requirepass ${REDIS_PASSWORD:-lallamaollama2026} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mcp-network
    restart: unless-stopped
  agent-engine:
    build:
      context: ./agent-engine
      dockerfile: Dockerfile
    container_name: agent-engine
    mem_limit: ${ENGINE_MEM_LIMIT:-512m}
    ports:
      - "${ENGINE_PORT:-3020}:${ENGINE_PORT:-3020}"
      - "3021:3021"
    environment:
      - ENGINE_PORT=${ENGINE_PORT:-3020}
      - BACKEND_URL=http://backend:3016
      - BRAIN_URL=http://brain:3015
      - REDIS_URL=redis://:${REDIS_PASSWORD:-lallamaollama2026}@redis:6379
      - API_KEY=${API_KEY:-McPOllama2026-V1-Home}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-llama3.2:3b}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600000}
      - WORKSPACE_DIR=/workspace
      - DB_PATH=/data/agent-engine.db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}
      - TRANSFORMERS_CACHE=/data/transformers
      - BRAIN_PROJECT=${BRAIN_PROJECT:-AgenteLaLlamaOllama}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
      - ./data:/data
    depends_on:
      - backend
      - mcp-brain
      - redis
    networks:
      - mcp-network
    restart: unless-stopped

networks:
  mcp-network:
    driver: bridge

volumes:
  ollama_data:
  brain_data:
  redis_data: